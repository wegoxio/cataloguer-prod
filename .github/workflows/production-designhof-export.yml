name: Production DesignHof catalogue export

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: [self-hosted, Linux, X64, cataloguer-prod]
    environment: production
    steps:
      - name: Locate healthy production backend
        shell: bash
        run: |
          set -euo pipefail
          container="$(docker ps --filter label=com.docker.compose.service=backend --format '{{.ID}}' | head -n 1)"
          [ -n "$container" ] || { echo '::error::Production backend container not found'; exit 1; }
          health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")"
          [ "$health" = healthy ] || { echo "::error::Production backend is $health"; exit 1; }
          echo "BACKEND_CONTAINER=$container" >> "$GITHUB_ENV"
      - name: Generate workbook from production
        shell: bash
        run: docker exec "$BACKEND_CONTAINER" node dist/jobs/export-designhof-products.main.js
      - name: Copy workbook from backend
        shell: bash
        run: docker cp "$BACKEND_CONTAINER:/tmp/designhof-catalogue-production.xlsx" "$RUNNER_TEMP/designhof-catalogue-production.xlsx"
      - name: Upload protected workbook artifact
        uses: actions/upload-artifact@v4
        with:
          name: designhof-catalogue-production
          path: ${{ runner.temp }}/designhof-catalogue-production.xlsx
          if-no-files-found: error
          retention-days: 7
