name: DesignHof production reconciliation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/designhof-production-reconciliation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: designhof-production-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile products and prices
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-designhof-reconciliation]')
    runs-on: [self-hosted, Linux, X64, cataloguer-prod]
    timeout-minutes: 45
    steps:
      - name: Wait for the backend release containing this reconciliation
        shell: bash
        run: |
          set -euo pipefail
          expected_image="cataloguer-backend:${GITHUB_SHA}"
          for attempt in $(seq 1 120); do
            container="$(docker ps \
              --filter label=com.docker.compose.service=backend \
              --format '{{.ID}}' | head -n 1)"
            if [ -n "$container" ]; then
              image="$(docker inspect --format '{{.Config.Image}}' "$container")"
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")"
              if [ "$image" = "$expected_image" ] && [ "$health" = "healthy" ]; then
                echo "BACKEND_CONTAINER=$container" >> "$GITHUB_ENV"
                echo "Using healthy backend container $container ($image)"
                exit 0
              fi
              echo "Attempt $attempt/120: backend image=$image health=$health; waiting for $expected_image"
            else
              echo "Attempt $attempt/120: no backend container found"
            fi
            sleep 5
          done
          echo "::error::The backend release $expected_image was not healthy after 10 minutes"
          exit 1

      - name: Prepare report directories
        run: |
          set -euo pipefail
          REPORT_ROOT="$RUNNER_TEMP/designhof-production-reconciliation"
          echo "REPORT_ROOT=$REPORT_ROOT" >> "$GITHUB_ENV"
          rm -rf "$REPORT_ROOT"
          mkdir -p \
            "$REPORT_ROOT/missing-master" \
            "$REPORT_ROOT/h1-price-changes" \
            "$REPORT_ROOT/h1-price-baseline"
          docker exec "$BACKEND_CONTAINER" rm -rf /tmp/designhof-production-reconciliation
          docker exec "$BACKEND_CONTAINER" mkdir -p \
            /tmp/designhof-production-reconciliation/missing-master \
            /tmp/designhof-production-reconciliation/h1-price-changes \
            /tmp/designhof-production-reconciliation/h1-price-baseline

      - name: Import missing master products
        run: |
          set -euo pipefail
          report_dir=/tmp/designhof-production-reconciliation/missing-master
          docker exec "$BACKEND_CONTAINER" node dist/jobs/import-missing-master-products.main.js plan \
            --report-dir "$report_dir"
          docker exec "$BACKEND_CONTAINER" node dist/jobs/import-missing-master-products.main.js execute \
            --confirm IMPORT_MISSING_MASTER_PRODUCTS \
            --report-dir "$report_dir"
          docker exec "$BACKEND_CONTAINER" node dist/jobs/import-missing-master-products.main.js plan \
            --report-dir "$report_dir"
          docker cp "$BACKEND_CONTAINER:$report_dir/." "$REPORT_ROOT/missing-master/"

      - name: Apply authoritative H1 price changes
        run: |
          set -euo pipefail
          report_dir=/tmp/designhof-production-reconciliation/h1-price-changes
          docker exec "$BACKEND_CONTAINER" node dist/jobs/update-h1-prices.main.js plan \
            --manifest /app/dist/jobs/data/h1-price-changes-2026-11-18.json \
            --allow-missing-products --sync-store-overrides \
            --report-dir "$report_dir"
          docker exec "$BACKEND_CONTAINER" node dist/jobs/update-h1-prices.main.js execute \
            --manifest /app/dist/jobs/data/h1-price-changes-2026-11-18.json \
            --allow-missing-products --sync-store-overrides \
            --confirm UPDATE_H1_PRICES \
            --report-dir "$report_dir"
          docker cp "$BACKEND_CONTAINER:$report_dir/." "$REPORT_ROOT/h1-price-changes/"

      - name: Validate reference price workbook
        run: |
          set -euo pipefail
          report_dir=/tmp/designhof-production-reconciliation/h1-price-baseline
          docker exec "$BACKEND_CONTAINER" node dist/jobs/update-h1-prices.main.js plan \
            --manifest /app/dist/jobs/data/h1-price-baseline-2026-11-18.json \
            --allow-missing-products \
            --report-dir "$report_dir"
          docker cp "$BACKEND_CONTAINER:$report_dir/." "$REPORT_ROOT/h1-price-baseline/"

      - name: Collect reconciliation reports
        if: always()
        shell: bash
        run: |
          set +e
          REPORT_ROOT="${REPORT_ROOT:-$RUNNER_TEMP/designhof-production-reconciliation}"
          mkdir -p "$REPORT_ROOT/missing-master" "$REPORT_ROOT/h1-price-changes" "$REPORT_ROOT/h1-price-baseline"
          if [ -n "${BACKEND_CONTAINER:-}" ]; then
            for report in missing-master h1-price-changes h1-price-baseline; do
              docker cp \
                "$BACKEND_CONTAINER:/tmp/designhof-production-reconciliation/$report/." \
                "$REPORT_ROOT/$report/" 2>/dev/null || true
            done
          fi

      - name: Expose reconciliation reports in logs
        if: always()
        run: |
          for directory in \
            "$REPORT_ROOT/missing-master" \
            "$REPORT_ROOT/h1-price-changes" \
            "$REPORT_ROOT/h1-price-baseline"; do
            for report in "$directory"/*.json; do
              [ -f "$report" ] || continue
              echo "::group::$report"
              cat "$report"
              echo
              echo "::endgroup::"
            done
          done

      - name: Publish reconciliation diagnostics
        if: always()
        shell: bash
        run: |
          python3 - "$REPORT_ROOT" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          reports = sorted(root.rglob("*.json"))
          if not reports:
              print("::error title=DesignHof reconciliation::No JSON report was generated")
              raise SystemExit(0)

          for report in reports:
              try:
                  data = json.loads(report.read_text(encoding="utf-8"))
              except Exception as error:
                  message = f"Cannot read {report}: {error}"
                  print(f"::error title=Unreadable reconciliation report::{message}")
                  continue

              diagnostic = {
                  key: data.get(key)
                  for key in (
                      "status",
                      "mode",
                      "summary",
                      "errors",
                      "warnings",
                      "missingProducts",
                      "unmatched",
                      "conflicts",
                  )
                  if data.get(key) not in (None, [], {})
              }
              message = json.dumps(diagnostic, ensure_ascii=False, separators=(",", ":"))
              message = message[:6000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              level = "error" if str(data.get("status", "")).upper() == "FAILED" else "notice"
              title = f"{report.parent.name}/{report.name}".replace("%", "%25").replace("\r", "").replace("\n", " ")
              print(f"::{level} title={title}::{message}")
          PY
