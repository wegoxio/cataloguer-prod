name: Production EXTERIORES stock and publication

on:
  workflow_dispatch:
    inputs:
      execute:
        description: Execute after reviewing the plan
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  exteriores:
    runs-on: [self-hosted, Linux, X64, cataloguer-prod]
    environment: production
    steps:
      - name: Locate healthy production backend
        shell: bash
        run: |
          set -euo pipefail
          container="$(docker ps --filter label=com.docker.compose.service=backend --format '{{.ID}}' | head -n 1)"
          [ -n "$container" ] || { echo '::error::Production backend container not found'; exit 1; }
          health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")"
          [ "$health" = healthy ] || { echo "::error::Production backend is $health"; exit 1; }
          echo "BACKEND_CONTAINER=$container" >> "$GITHUB_ENV"
      - name: Plan exact EXTERIORES scope
        shell: bash
        run: docker exec "$BACKEND_CONTAINER" node dist/jobs/publish-exteriores-stock.main.js plan
      - name: Publish and set exact stock to two
        if: ${{ inputs.execute }}
        shell: bash
        run: docker exec "$BACKEND_CONTAINER" node dist/jobs/publish-exteriores-stock.main.js execute PUBLISH_EXTERIORES_STOCK_2
