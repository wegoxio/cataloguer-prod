name: Production user purge

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-user-maintenance
  cancel-in-progress: false

jobs:
  purge:
    runs-on: [self-hosted, Linux, X64, cataloguer-prod]
    timeout-minutes: 10
    steps:
      - name: Locate healthy production backend
        shell: bash
        run: |
          set -euo pipefail
          container="$(docker ps --filter label=com.docker.compose.service=backend --format '{{.ID}}' | head -n 1)"
          [ -n "$container" ] || { echo '::error::Production backend container not found'; exit 1; }
          health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")"
          [ "$health" = healthy ] || { echo "::error::Production backend is $health"; exit 1; }
          echo "BACKEND_CONTAINER=$container" >> "$GITHUB_ENV"

      - name: Plan, purge and verify account
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$BACKEND_CONTAINER" node dist/jobs/purge-user.main.js plan
          docker exec "$BACKEND_CONTAINER" node dist/jobs/purge-user.main.js execute 'PURGE_USER:coclemmert@gmail.com'
          docker exec "$BACKEND_CONTAINER" node dist/jobs/purge-user.main.js plan
